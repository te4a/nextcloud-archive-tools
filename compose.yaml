name: archive-tools-dev

services:
  nextcloud:
    image: archive-tools-nextcloud-dev:34.0.5-7zip26.06
    build:
      context: .
      dockerfile: dev/Dockerfile
    ports:
      - "127.0.0.1:18080:80"
    environment:
      POSTGRES_HOST: database
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      # Development-only credentials; nothing from the production server is copied.
      POSTGRES_PASSWORD: ${ARCHIVE_TOOLS_ADMIN_PASSWORD:?Create .env first}
      REDIS_HOST: redis
      NEXTCLOUD_ADMIN_USER: admin
      NEXTCLOUD_ADMIN_PASSWORD: ${ARCHIVE_TOOLS_ADMIN_PASSWORD:?Create .env first}
      NEXTCLOUD_TRUSTED_DOMAINS: localhost 127.0.0.1
      PHP_MEMORY_LIMIT: 512M
      PHP_UPLOAD_LIMIT: 1G
    volumes:
      - nextcloud34pgsql:/var/www/html
      - ./app:/var/www/html/custom_apps/archive_tools:ro
      - ./tests:/opt/archive-tools-tests:ro
      - ./dev/php.ini:/usr/local/etc/php/conf.d/zz-archive-tools-dev.ini:ro
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy

  database:
    image: postgres:17.11-alpine@sha256:3540c0362c809df084ffac0ae69fe794515f9de92692f02178bcdce0ef0302ac
    environment:
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: ${ARCHIVE_TOOLS_ADMIN_PASSWORD:?Create .env first}
    volumes:
      - postgres34:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextcloud -d nextcloud"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.4.12-alpine@sha256:a58a2b51fdb121a55861f2586cbde33f174c0f33d5a277b182d52dce45ed9cd4
    volumes:
      - redis34:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  nextcloud34pgsql:
    labels:
      com.archive-tools.nextcloud-major: "34"
      com.archive-tools.database: "pgsql"
  postgres34:
  redis34:
  # Preserve the successful standalone SQLite validation instance too.
  nextcloud34:
    labels:
      com.archive-tools.nextcloud-major: "34"
  # Retain the previous NC35 data volume; never boot NC34 with its database.
  nextcloud:
