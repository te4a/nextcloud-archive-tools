name: Release validation

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: NC${{ matrix.nextcloud }} / ${{ matrix.database }} / PHP 8.5
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { nextcloud: '34', database: pgsql, suite: full, browser: true }
          - { nextcloud: '35', database: pgsql, suite: full, browser: true }
          - { nextcloud: '34', database: sqlite, suite: critical, browser: false }
          - { nextcloud: '34', database: mariadb, suite: critical, browser: false }
          - { nextcloud: '35', database: mysql, suite: critical, browser: false }
    steps:
      # Official release tag commits verified through the GitHub API; no floating refs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install pinned package manager and locked frontend dependencies
        run: |
          npm install --global --ignore-scripts pnpm@11.25.0
          pnpm install --frozen-lockfile --ignore-scripts --store-dir .pnpm-store
      - name: Verify UI helpers, translations and build
        env:
          pnpm_config_verify_deps_before_run: error
          pnpm_config_store_dir: ${{ github.workspace }}/.pnpm-store
        run: |
          python3 -m unittest discover -s ci -p 'test_*.py' -v
          python3 tests/package-runtime.py
          node --test tests/*.test.mjs
          python3 dev/update-translations.py
          git diff --exit-code -- app/l10n app/src/messages.json
          pnpm run typecheck
          node ci/clean-assets.mjs
          pnpm run build
      - name: Install pinned browser tooling
        if: matrix.browser
        run: |
          pnpm --dir ci/browser install --frozen-lockfile --ignore-scripts --store-dir ../../.pnpm-store
          node ci/browser/node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Run isolated backend and browser release gates
        env:
          NC_MAJOR: ${{ matrix.nextcloud }}
          TEST_DATABASE: ${{ matrix.database }}
          TEST_SUITE: ${{ matrix.suite }}
          TEST_BROWSER: ${{ matrix.browser }}
        run: |
          args=(--nextcloud "$NC_MAJOR" --database "$TEST_DATABASE" --suite "$TEST_SUITE" --port 18081)
          if [ "$TEST_BROWSER" = true ]; then args+=(--browser); fi
          python3 ci/run.py "${args[@]}"
      - name: Keep sanitized assertion reports and fixture screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-validation-nc${{ matrix.nextcloud }}-${{ matrix.database }}
          path: .test-results/ci-public/
          if-no-files-found: ignore
          retention-days: 14
          # .ci-runs contains generated passwords and private logs; never upload it.
          include-hidden-files: false
